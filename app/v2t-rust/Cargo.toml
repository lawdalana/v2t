[package]
name = "v2t-desktop"
version = "2.2.1"
description = "Voice typing for Windows, Linux, and macOS"
edition = "2024"
rust-version = "1.93"
publish = false

[[bin]]
name = "V2t"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
csv = "1.4"
getrandom = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls-native-roots"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision"] }
sha2 = "0.10"
time = { version = "0.3", features = ["formatting", "parsing", "macros", "local-offset"] }
unicode-general-category = "1"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
zeroize = "1.8"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
signal-hook = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std", "NSAlert", "NSApplication", "NSButton", "NSButtonCell", "NSCell", "NSColor", "NSControl",
    "NSEvent", "NSFont", "NSGraphics", "NSMenu", "NSMenuItem", "NSPasteboard", "NSPopUpButton",
    "NSResponder", "NSScrollView", "NSSound", "NSStatusBar", "NSStatusBarButton", "NSStatusItem", "NSText",
    "NSTableColumn", "NSTableHeaderView", "NSTableView", "NSTextContainer", "NSTextField",
    "NSTextView", "NSUserInterfaceItemIdentification", "NSView", "NSWindow", "block2",
    "objc2-core-foundation",
] }
objc2-audio-toolbox = { version = "0.3.2", default-features = false, features = [
    "std", "AudioQueue", "objc2-core-audio-types", "objc2-core-foundation",
] }
objc2-av-foundation = { version = "0.3.2", default-features = false, features = [
    "std", "AVCaptureDevice", "AVMediaFormat", "block2",
] }
objc2-core-audio-types = { version = "0.3.2", default-features = false, features = [
    "std", "CoreAudioBaseTypes",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std", "NSBundle", "NSRunLoop", "NSTimer", "NSURL",
] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
tempfile = "3.27"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_UI_Shell",
] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_Multimedia",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_DataExchange",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_RemoteDesktop",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
